[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mllm-vision-lab"
version = "0.1.0"
description = "Portable, resumable BabyVision experiments on local and Colab GPUs"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
research = [
  "transformers==4.57.6", "accelerate==1.12.0",
  "huggingface-hub==0.36.2", "safetensors==0.8.0",
  "pillow==12.3.0", "regex==2026.9.29", "numpy==2.2.6"
]

[project.scripts]
visionlab = "visionlab.__main__:main"

[tool.setuptools.packages.find]
include = ["visionlab*"]
